# Do NOT show exception details (incl. any API keys) in the browser.
[client]
showErrorDetails = false

[server]
headless = true

# Brand theme — gold / green / tan.
[theme]
base = "dark"
primaryColor = "#CBA135"            # gold
backgroundColor = "#0E1A12"         # deep green-black canvas
secondaryBackgroundColor = "#15271B" # panel green
textColor = "#EADFC6"               # tan
font = "sans serif"
