# Do NOT show exception details (incl. any API keys) in the browser.
[client]
showErrorDetails = false
toolbarMode = "minimal"   # hides the Deploy button and the hamburger menu

[server]
headless = true
address = "127.0.0.1"   # never listen on the Wi-Fi; the Cloudflare tunnel connects from this machine

# Base theme for Streamlit's native widgets. The real design tokens (and the
# dark/light switch) live in ui/theme.py; these mirror its dark values.
[theme]
base = "dark"
primaryColor = "#f26b3a"
backgroundColor = "#050505"
secondaryBackgroundColor = "#0e0e0f"
textColor = "#f5f5f4"
