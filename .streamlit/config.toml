# Do NOT show exception details (incl. any API keys) in the browser.
[client]
showErrorDetails = false

[server]
headless = true

# thinkorswim-style terminal theme (gold / green / tan on charcoal).
[theme]
base = "dark"
primaryColor = "#D9A441"             # gold accent
backgroundColor = "#0B0C0E"          # terminal charcoal
secondaryBackgroundColor = "#15171B"  # panel
textColor = "#D7D2C4"                # tan-gray
font = "monospace"
